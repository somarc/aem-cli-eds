<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AEM CLI video hero poster</title>
  <desc id="desc">A cinematic terminal grid showing AEM CLI command flows moving between Git, DA content, Helix preview, and live delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset=".46" stop-color="#111827"/>
      <stop offset="1" stop-color="#281408"/>
    </linearGradient>
    <radialGradient id="gold" cx=".24" cy=".74" r=".52">
      <stop offset="0" stop-color="#fabd2f" stop-opacity=".58"/>
      <stop offset=".54" stop-color="#fabd2f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fabd2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx=".76" cy=".24" r=".46">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".5"/>
      <stop offset=".58" stop-color="#58a6ff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#fabd2f" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#gold)"/>
  <rect width="1920" height="1080" fill="url(#blue)"/>
  <g opacity=".42" stroke="#8ec07c" stroke-width="2" fill="none">
    <path d="M1240 188c132 46 228 112 287 198 78 114 67 250-31 346-106 104-294 151-518 136" filter="url(#glow)"/>
    <path d="M1070 756c-186-8-324-53-414-134-96-86-116-205-51-309 58-92 178-160 340-193" filter="url(#glow)"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(154 188)">
      <rect width="640" height="360" rx="18" fill="#0d1117" fill-opacity=".88" stroke="#30363d"/>
      <rect width="640" height="42" rx="18" fill="#161b22"/>
      <circle cx="28" cy="21" r="6" fill="#fb4934"/>
      <circle cx="50" cy="21" r="6" fill="#fabd2f"/>
      <circle cx="72" cy="21" r="6" fill="#8ec07c"/>
      <text x="32" y="92" fill="#8b949e" font-size="24">$</text>
      <text x="64" y="92" fill="#fabd2f" font-size="24">aem content seed ./site --commit</text>
      <text x="64" y="146" fill="#58a6ff" font-size="22">/source/somarc/aem-cli-eds/index.html</text>
      <text x="64" y="192" fill="#7ee787" font-size="22">preview: https://main--aem-cli-eds--somarc.aem.page/</text>
      <text x="64" y="238" fill="#f0f0e8" font-size="22">route: contentbus</text>
      <text x="64" y="284" fill="#8b949e" font-size="22">dry-run unless --commit is explicit</text>
    </g>
    <g transform="translate(1034 258)" filter="url(#glow)">
      <rect width="246" height="82" rx="12" fill="#111827" stroke="#58a6ff"/>
      <text x="24" y="36" fill="#58a6ff" font-size="22" font-weight="700">DA content</text>
      <text x="24" y="62" fill="#8b949e" font-size="15">author bus</text>
    </g>
    <g transform="translate(1330 466)" filter="url(#glow)">
      <rect width="260" height="82" rx="12" fill="#111827" stroke="#fabd2f"/>
      <text x="24" y="36" fill="#fabd2f" font-size="22" font-weight="700">Helix preview</text>
      <text x="24" y="62" fill="#8b949e" font-size="15">aem.page</text>
    </g>
    <g transform="translate(970 704)" filter="url(#glow)">
      <rect width="238" height="82" rx="12" fill="#111827" stroke="#8ec07c"/>
      <text x="24" y="36" fill="#8ec07c" font-size="22" font-weight="700">Live edge</text>
      <text x="24" y="62" fill="#8b949e" font-size="15">aem.live</text>
    </g>
    <g transform="translate(670 674)" filter="url(#glow)">
      <rect width="232" height="82" rx="12" fill="#111827" stroke="#a78bfa"/>
      <text x="24" y="36" fill="#a78bfa" font-size="22" font-weight="700">Git code</text>
      <text x="24" y="62" fill="#8b949e" font-size="15">blocks + tools</text>
    </g>
  </g>
  <g stroke="#fabd2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".72" filter="url(#glow)">
    <path d="M794 368C900 320 954 304 1034 299"/>
    <path d="M1280 326c98 33 156 76 185 140"/>
    <path d="M1450 548c-60 88-138 135-242 185"/>
    <path d="M970 746c-34-2-48-1-68 0"/>
  </g>
  <rect width="1920" height="1080" fill="#000" opacity=".18"/>
</svg>
