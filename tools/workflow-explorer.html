<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Explorer - AEM CLI</title>
<link rel="stylesheet" href="/styles/fonts.css">
<link rel="stylesheet" href="/styles/styles.css">
<link rel="stylesheet" href="/styles/aem-cli-site.css">
</head>
<body class="aem-cli-site">
<div class="workflow-app">
  <aside class="workflow-side">
    <a class="site-brand" href="/">AEM CLI</a>
    <h1>Workflow Explorer</h1>
    <p>Click a command to trace the operational flow.</p>
    <div id="workflow-list"></div>
  </aside>
  <main class="workflow-main">
    <p class="eyebrow">Interactive command map</p>
    <h2 id="workflow-title">aem preview page</h2>
    <p id="workflow-summary">Preview one DA source document by flushing DA preview and triggering the Helix preview build.</p>
    <div class="flow-panel" id="workflow-flow"></div>
    <div class="workflow-detail">
      <h3>Command contract</h3>
      <pre class="terminal" id="workflow-command"></pre>
      <h3>Notes</h3>
      <ul id="workflow-notes"></ul>
    </div>
  </main>
</div>
<script>
const workflows = [
  {
    name: 'aem auth login',
    summary: 'Create or reuse the project-local DA token cache.',
    command: 'aem auth login',
    flow: ['CLI args', 'IMS browser flow', '.hlx token cache', 'ready for admin calls'],
    notes: ['Stores token under .hlx/.da-token.json.', 'Automation can pass --token.'],
  },
  {
    name: 'aem preview page',
    summary: 'Flush DA preview and trigger the Helix preview pipeline.',
    command: 'aem preview page /index --owner somarc --repo aem-cli-eds',
    flow: ['resolve owner/repo', 'load token', 'DA preview flush', 'Helix preview'],
    notes: ['Safe to run without --commit.', 'Outputs the aem.page URL when available.'],
  },
  {
    name: 'aem publish page',
    summary: 'Promote one previewed page to live CDN.',
    command: 'aem publish page /index --commit',
    flow: ['target preflight', '--commit check', 'Helix live call', 'aem.live URL'],
    notes: ['Dry-run by default.', 'Live mutation requires --commit.'],
  },
  {
    name: 'aem deploy page',
    summary: 'Preview a page, then publish it when commit is supplied.',
    command: 'aem deploy page /index --commit',
    flow: ['DA flush', 'Helix preview', '--commit check', 'Helix live'],
    notes: ['Preview always runs.', 'Publish step is commit-gated.'],
  },
  {
    name: 'aem route classify',
    summary: 'Classify route ownership using DA source and Helix status probes.',
    command: 'aem route classify /blog/post',
    flow: ['probe DA source', 'probe Helix status', 'compare sourceLocation', 'return ownership'],
    notes: ['Exit codes distinguish contentbus, codebus, hybrid, orphan, and probe-failed.'],
  },
  {
    name: 'aem index validate',
    summary: 'Compare configured helix-query fields against query-index output.',
    command: 'aem index validate --env preview',
    flow: ['parse helix-query.yaml', 'build preview/live URL', 'fetch query JSON', 'report missing fields'],
    notes: ['Uses Adobe shared index config parsing.', 'Read-only validation.'],
  },
  {
    name: 'aem code sync',
    summary: 'Trigger code-bus sync for a path after commit confirmation.',
    command: 'aem code sync /styles/styles.css --commit',
    flow: ['target preflight', '--commit check', 'Helix code call', 'job or status response'],
    notes: ['Mutation is commit-gated.', 'Use code status first when troubleshooting.'],
  },
];

const list = document.getElementById('workflow-list');
const title = document.getElementById('workflow-title');
const summary = document.getElementById('workflow-summary');
const flow = document.getElementById('workflow-flow');
const command = document.getElementById('workflow-command');
const notes = document.getElementById('workflow-notes');

function render(item) {
  title.textContent = item.name;
  summary.textContent = item.summary;
  command.textContent = item.command;
  flow.replaceChildren(...item.flow.map((step, i) => {
    const node = document.createElement('div');
    node.className = 'flow-node';
    node.innerHTML = `<strong>${i + 1}. ${step}</strong><span>${item.name}</span>`;
    return node;
  }));
  notes.replaceChildren(...item.notes.map((note) => {
    const li = document.createElement('li');
    li.textContent = note;
    return li;
  }));
  document.querySelectorAll('.workflow-command').forEach((button) => {
    button.classList.toggle('active', button.textContent === item.name);
  });
}

workflows.forEach((item) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'workflow-command';
  button.textContent = item.name;
  button.addEventListener('click', () => render(item));
  list.append(button);
});

render(workflows[1]);
</script>
</body>
</html>
